setup.open.botfather = Open @BotFather
setup.steps.title = How to set this up
setup.step1 = 1. Send @BotFather the /newbot command, pick a name and a username — it hands you a token.
setup.step2 = 2. Paste that token here and press «Save and check».
setup.step3 = 3. Create a supergroup in Telegram and turn on Topics in its settings.
setup.step4 = 4. Add the bot to the group and make it an admin — without that it cannot create topics.
setup.step5 = 5. Send /register in the group. That is it: the topics appear by themselves.
setup.step6 = 6. Press «Install hooks» — then restart any open VSCode windows.
