help.text = <b>Claude Code ↔ Telegram</b>\n\n/away, /here — presence mode\n/status — live sessions and what waits for an answer\n/projects — pick the bridged projects\n/queue — tasks waiting for a session\n/claude_status — Anthropic service status\n/release — hand every pending wait back to VSCode\n/unregister — release this group\n\nPlain text written into a project topic becomes that session's next task.
