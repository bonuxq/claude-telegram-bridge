menu.alarm = Alarm...
alarm.title = Alarm
alarm.hint = While you are away, a session that nobody answers sleeps this long and then checks back. Nothing outside a session can start a turn in it, so checking back is what keeps it reachable. 0 turns it off.
alarm.minutes = Minutes
alarm.apply = Apply
alarm.on = Set: back every {minutes} min
alarm.off = Off — a session that runs out of wait stops listening
alarm.bad = Minutes, as a whole number
widget.alarm = ⏰ Alarm: back every {minutes} min
widget.alarm.idle = ⏰ Alarm: idle while you are at the PC
alarm.set = You are in away mode: nothing can start a turn in you from the chat while no turn is running. Set yourself an alarm and stop there — start exactly one background command, `sleep {seconds}` (run_in_background), then end the turn without doing or saying anything else. You will be woken when it finishes, and whatever was written in Telegram meanwhile is yours to pick up.
stop.parked = ⏳ No answer — the session stopped listening. Write here later and I will start a fresh one for the task.
stop.released = 🖥 You are at the PC — control returned to VSCode.
stop.again = ⬅ Control is back here. The turn is still open.
stop.hold = ⏳ Wait released. The session was told nothing — it goes back to the alarm it set itself. Write here and I hand it over the moment it acts.
ask.timeout = ⏳ The question got no answer — it returns to you in VSCode.
ask.head = {name} · question {index}/{total}
ask.multi = *Pick several if needed, then «Done».*
ask.reply = *Or answer with plain text by replying to this message.*
queue.context = Tasks queued via Telegram while the session was not listening:
queue.live = Typed into Telegram while this turn was running:
queue.handed = ▶️ Handed over mid-turn: {task}
ack.continue = accepted, continuing
ack.queued = nothing is open here — the task waits for the next session
ack.handoff = the session is working — handing this over at its next step
ack.midstep = the session is between turns — it takes this the moment it moves
away.idle = ⏸ This session had already finished its turn when control came over — it cannot be woken from here. Flip the switch while a turn is still running and it waits for you itself. What you write now catches it the moment it takes any step.
ack.answer = answer accepted
ack.spawned = no session is open — starting an agent for this task

