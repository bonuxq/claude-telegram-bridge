setup.steps.title = Πώς γίνεται η ρύθμιση
setup.step1 = 1. Στείλε στον @BotFather την εντολή /newbot, διάλεξε όνομα και username — θα σου δώσει ένα token.
setup.step2 = 2. Επικόλλησε το token εδώ και πάτα «Αποθήκευση και έλεγχος».
setup.step3 = 3. Φτιάξε μια υπερομάδα στο Telegram και ενεργοποίησε τα Θέματα (Topics) στις ρυθμίσεις της.
setup.step4 = 4. Πρόσθεσε το bot στην ομάδα και κάνε το διαχειριστή — αλλιώς δεν μπορεί να φτιάξει θέματα.
setup.step5 = 5. Στείλε /register στην ομάδα. Τέλος: τα θέματα εμφανίζονται μόνα τους.
setup.step6 = 6. Πάτα «Εγκατάσταση hooks» — και ξαναξεκίνησε τα ανοιχτά παράθυρα του VSCode.
