setup.steps.title = Cómo configurarlo
setup.step1 = 1. Envía /newbot a @BotFather, elige un nombre y un username — te dará un token.
setup.step2 = 2. Pega ese token aquí y pulsa «Guardar y comprobar».
setup.step3 = 3. Crea un supergrupo en Telegram y activa los Temas (Topics) en sus ajustes.
setup.step4 = 4. Añade el bot al grupo y hazlo administrador — sin eso no puede crear temas.
setup.step5 = 5. Envía /register en el grupo. Listo: los temas aparecen solos.
setup.step6 = 6. Pulsa «Instalar hooks» — y reinicia las ventanas de VSCode abiertas.
