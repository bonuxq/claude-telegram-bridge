setup.steps.title = Como configurar
setup.step1 = 1. Envie /newbot ao @BotFather, escolha um nome e um username — ele devolve um token.
setup.step2 = 2. Cole esse token aqui e carregue em «Guardar e verificar».
setup.step3 = 3. Crie um supergrupo no Telegram e ligue os Tópicos (Topics) nas definições dele.
setup.step4 = 4. Adicione o bot ao grupo e torne-o administrador — sem isso não consegue criar tópicos.
setup.step5 = 5. Envie /register no grupo. Pronto: os tópicos aparecem sozinhos.
setup.step6 = 6. Carregue em «Instalar hooks» — e reinicie as janelas do VSCode abertas.
