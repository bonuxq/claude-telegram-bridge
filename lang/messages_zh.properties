setup.step1 = 1. 给 @BotFather 发送 /newbot，取个名字和 username，它会给你一个令牌。
setup.step2 = 2. 把令牌粘贴到这里，点击「保存并检查」。
setup.step3 = 3. 在 Telegram 建一个超级群，并在设置里打开话题（Topics）。
setup.step4 = 4. 把机器人加进群并设为管理员 — 否则它无法创建话题。
setup.step5 = 5. 在群里发送 /register。完成：话题会自动出现。
setup.step6 = 6. 点击「安装钩子」，然后重启已打开的 VSCode 窗口。
